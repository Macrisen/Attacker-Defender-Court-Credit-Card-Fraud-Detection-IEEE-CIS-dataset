threat_model:
  version: phase3_5_v1
  scope: offline_research_simulator
  objective: fraudulent transaction receives APPROVE
  knowledge:
    observes:
    - current_authorized_control_values
    - original_authorized_control_values
    - action_history
    - remaining_budget
    architecture_known: false
    probabilities_visible: false
    feedback: final_decision_only
    max_defender_queries: 1
    excludes:
    - other_labels
    - future_transactions
    - pending_verification_labels
    - evaluator_paired_scores
  episode:
    max_steps: 3
    stop: final continuous action coordinate greater than zero submits
    invalid_action: reject_and_terminate
    clip_actions: false
  rewards:
    fraud_approved: 1.0
    fraud_flagged: -1.0
    invalid: -2.0
    cost_weight: 1.0
  scenarios:
    A:
      name: conservative_real_data
      enabled: false
      controls: []
      label_assumption: null
      dependency_status: UNKNOWN
      status: BLOCKED
    B:
      name: hypothetical_amount_sensitivity
      enabled: true
      controls:
      - feature: transactionamt
        relative_limit: 0.05
        weight: 1.0
        minimum: 0.001
      label_assumption: hypothetical_fraud_intent_unchanged_under_bounded_amount_edit
      dependency_status: UNKNOWN
      status: UNKNOWN_VALIDITY
      permission: proposal_and_validator_only_no_defender_query_until_dependencies_resolved
      interpretation: not_verified_realistic_financial_fraud
    synthetic:
      name: controlled_quantity_fixture
      enabled: true
      controls:
      - feature: quantity
        absolute_limit: 2.0
        weight: 1.0
        minimum: 1.0
        maximum: 10.0
      label_assumption: synthetic_fraud_intent_independent_of_quantity
      dependency_status: VERIFIED_FIXTURE
      dependencies:
      - output: total
        operation: multiply
        inputs:
        - quantity
        - unit_price
      status: SYNTHETIC_ONLY
